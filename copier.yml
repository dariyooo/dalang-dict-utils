# Copier template for DaLang dictionary repos, see docs/repo-standard.md.
#
#   new repo:       uvx copier copy --trust gh:dariyooo/dalang-dict-utils <repo>
#   update a repo:  uvx copier update --trust

_subdirectory: template
_answers_file: .copier-answers.yml
_min_copier_version: "9.5"

# Files the repo owns after creation, `copier update` never touches them
_skip_if_exists:
  - README.md
  - build.py
  - "{{ module_name }}/**"
  - tests/**
  - vendored_sources/README.md
  # Written by the `uv lock` task below, keeping it out of Copier's diff avoids merge conflicts
  - uv.lock

repo_name:
  type: str
  help: "Repo name, `{script}-{content}-{target}` (e.g. kanji-jlpt-levels-yomitan)"
  validator: >-
    {% if not (repo_name | regex_search('^[a-z0-9]+(-[a-z0-9]+)*-(yomitan|dakanji|dahanzi|dahanja|dalang)$')) %}
    Use lowercase kebab-case ending in -yomitan, -dakanji, -dahanzi, -dahanja or -dalang
    {% endif %}

module_name:
  type: str
  help: Python module with the conversion code
  default: "{{ repo_name | regex_replace('-(yomitan|dakanji|dahanzi|dahanja|dalang)$', '') | replace('-', '_') }}"
  validator: >-
    {% if not (module_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use a lowercase snake_case module name
    {% endif %}

description:
  type: str
  help: One line summary of the dictionary

github_owner:
  type: str
  help: GitHub owner of the repo
  default: dariyooo

python_version:
  type: str
  help: Python version
  default: "3.12"

dalang_dict_utils_tag:
  type: str
  help: dalang-dict-utils tag for the package and the reusable workflows
  default: v0.3.4

source_updates:
  type: bool
  help: >-
    Do the sources change? Yes: sources are fetched, locked in sources.lock.json and a weekly workflow
    rebuilds and releases on changes. No: frozen data is vendored in vendored_sources/ and released manually
  default: true

update_cron:
  type: str
  help: Cron of the auto update workflow
  default: "0 4 * * 1"
  when: "{{ source_updates }}"

# Creates uv.lock on copy. On update, tasks run before the repo's own changes (e.g. extra dependencies) are merged
# back, so the lock is updated by an "after" migration instead, which sees the merged pyproject.toml.
_tasks:
  - command: uv lock
    when: "{{ _copier_operation == 'copy' }}"

_migrations:
  - command: uv lock
    when: "{{ _stage == 'after' }}"
