name: Dictionary CI

# Reusable checks for dictionary repos, see docs/repo-standard.md.
#
#   jobs:
#     ci:
#       uses: dariyooo/dalang-dict-utils/.github/workflows/dict-ci.yml@<tag>

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest
