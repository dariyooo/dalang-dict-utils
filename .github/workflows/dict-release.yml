name: Dictionary Release

# Reusable build + release for dictionary repos, see docs/repo-standard.md.
# Runs on a pushed tag `YYYY-MM-DD`, builds the dictionaries with that tag as revision and publishes everything
# in out/ as the GitHub release of the tag, with notes listing the sources and changes since the previous release.
# A release of the same tag is replaced: re-release with `git tag -f <tag> && git push -f origin <tag>`.
#
#   on:
#     push:
#       tags: ["*"]
#   permissions:
#     contents: write
#   jobs:
#     ci:
#       uses: dariyooo/dalang-dict-utils/.github/workflows/dict-ci.yml@<tag>
#     release:
#       needs: ci
#       uses: dariyooo/dalang-dict-utils/.github/workflows/dict-release.yml@<tag>

on:
  workflow_call:
    inputs:
      build-command:
        description: Command that builds the dictionaries into out/
        type: string
        default: uv run build.py

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: dict-release
    steps:
      - name: Check tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || ! [[ "$TAG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Releases run on a pushed tag YYYY-MM-DD (the dictionary revision), got $REF_TYPE '$TAG'." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build dictionaries
        env:
          DALANG_DICT_REVISION: ${{ github.ref_name }}
        run: ${{ inputs.build-command }}

      - name: Check sources are locked
        run: |
          if [ -n "$(git status --porcelain -- sources.lock.json)" ]; then
            echo "The build changed sources.lock.json, commit the lock first (run \`uv run build.py\` locally)." >&2
            git diff -- sources.lock.json >&2
            exit 1
          fi

      - name: Check build output
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(out/*.zip out/*.json)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets in out/" >&2
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          for index in out/*.index.json; do
            revision="$(jq -r .revision "$index")"
            if [ "$revision" != "$TAG" ]; then
              echo "$index has revision '$revision', expected the tag '$TAG'." >&2
              exit 1
            fi
          done

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Compare with the latest other release, a release of the same tag is replaced below
          PREVIOUS="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName \
            --jq "[.[].tagName | select(. != \"$TAG\")][0] // empty")"
          mkdir -p tmp/previous-release
          if [ -n "$PREVIOUS" ]; then
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern "*.manifest.json" \
              --dir tmp/previous-release || echo "Release $PREVIOUS has no manifests."
          fi
          uv run python -m dalang_dict release-notes --previous tmp/previous-release | tee tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists, replacing it."
            gh release delete "$TAG" --repo "$REPO" --yes
          fi
          gh release create "$TAG" out/*.zip out/*.json --repo "$REPO" --title "$TAG" --verify-tag --latest \
            --notes-file tmp/release-notes.md --generate-notes
