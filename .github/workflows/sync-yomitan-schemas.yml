name: Sync Yomitan schemas

# Vendors Yomitan's dictionary schemas, commits upstream changes and shows them in the run summary,
# so a change in Yomitan's format is visible right away.

on:
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Sync and check schemas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run scripts/sync_yomitan_schemas.py

      - name: Run tests
        if: hashFiles('pyproject.toml') != ''
        run: uv run --locked pytest

      - name: Commit changes
        run: |
          SCHEMAS=src/dalang_dict/schemas/yomitan
          git add "$SCHEMAS"
          # SOURCE.json always records the newest commit, only report real schema changes
          if git diff --cached --quiet -- "$SCHEMAS" ':!'"$SCHEMAS/SOURCE.json"; then
            echo "Yomitan schemas unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Yomitan schemas changed"
            echo '```'
            git diff --cached --stat -- "$SCHEMAS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Yomitan dictionary schemas"
          git push
